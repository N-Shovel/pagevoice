# Lint, tests and license check on every pull request and every push to main.
# Branch protection on main requires both jobs below to pass, by name:
#   "checks (windows-latest)" and "checks (ubuntu-22.04)".
# Renaming the job or changing the matrix means updating branch protection too.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 matches the Linux release build (oldest supported glibc).
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved; a SHA can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -m "not slow"

      - name: Licenses
        run: uv run python tools/check_licenses.py
