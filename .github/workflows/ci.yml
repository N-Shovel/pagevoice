# Lint, tests and license check on every pull request and every push to main.
# Branch protection on main requires both jobs below to pass, by name:
#   "checks (windows-latest)" and "checks (ubuntu-22.04)".
# Renaming the job or changing the matrix means updating branch protection too.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 matches the Linux release build (oldest supported glibc).
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved; a SHA can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: uv sync --locked --extra gui  # GUI tests and its licences too

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -m "not slow"

      # Golden corpus: public books are downloaded by checksum (never committed) and
      # cached. Books that can't be fetched are skipped by the tests, not failed.
      - name: Cache corpus books
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/corpus/.downloads
          key: corpus-${{ hashFiles('tests/corpus/*/*/book.toml') }}

      - name: Golden corpus
        shell: bash
        run: |
          uv run python tools/corpus.py fetch || echo "::warning::some corpus books could not be fetched; their tests will skip"
          uv run pytest tests/corpus

      - name: Licenses
        run: uv run python tools/check_licenses.py
