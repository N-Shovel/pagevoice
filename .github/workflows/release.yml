# Builds the Windows installer and the Linux AppImage (SPEC §9), tests the BUILT apps
# (--self-test), and on a version tag attaches them to one GitHub release with the
# source of the GPL/LGPL programs inside them and every bundled package's licence.
#
#   Release:      git tag v1.0.0 && git push origin v1.0.0
#   Build only:   Actions tab > Release > Run workflow (artifacts to download, no release)
#   Pull request: runs when packaging changes, to catch a broken build before a release
#
# Signing turns on by itself for version tags once these exist (Settings > Secrets and
# variables > Actions):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
# Until then the builds are released unsigned. Pull requests and manual builds are never
# signed. A tag build fails if the voice manifest (model_manifest.json) isn't published.
# Mirrors folder-tracker's release.yml.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "tools/third_party.py"
      - "src/pagevoice/selftest.py"
      - "src/pagevoice_gui/app.py"

permissions:
  contents: read

jobs:
  ffmpeg:
    # Builds (or restores from cache) the LGPL-only ffmpeg and runs the export tests.
    uses: ./.github/workflows/ffmpeg.yml

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 90
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      PAGEVOICE_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Odd version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-Windows
          path: packaging/ffmpeg/out

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Build the app (PyInstaller, one folder)
        shell: bash
        run: |
          uv sync --locked --extra gui --group build
          uv run python tools/check_licenses.py
          uv run pyinstaller packaging/pagevoice.spec --noconfirm --log-level WARN
          if find dist/PageVoice -name '*.proposed.json' | grep -q .; then
            echo "The developer manifest got into the build" >&2; exit 1
          fi

      - name: Self-test the built app
        timeout-minutes: 10
        shell: pwsh
        run: |
          $p = Start-Process dist/PageVoice/PageVoice.exe -ArgumentList "--self-test", "selftest-windows.json" -Wait -PassThru
          Get-Content selftest-windows.json
          if ($p.ExitCode -ne 0) { throw "The built app failed its self-test" }

      - name: Upload the app folder for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PageVoice-app-unsigned
          path: dist/PageVoice

      - name: Sign the app (exe, ffmpeg and DLLs, as the policy allows)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pagevoice
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/PageVoice

      - name: Self-test the signed app
        if: env.SIGN == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $p = Start-Process dist/PageVoice/PageVoice.exe -ArgumentList "--self-test", "selftest-signed.json" -Wait -PassThru
          Get-Content selftest-signed.json
          if ($p.ExitCode -ne 0) { throw "The signed app failed its self-test" }

      - name: Build the installer (Inno Setup 6.7.1, pinned)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress --force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\pagevoice.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PageVoice-installer-unsigned
          path: dist/PageVoice-*-setup.exe

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pagevoice
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PageVoice-windows
          path: |
            dist/PageVoice-*-setup.exe
            selftest-windows.json
            selftest-signed.json
          if-no-files-found: warn

      - name: Attach to the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $file = (Get-Item dist/PageVoice-*-setup.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --title "PageVoice $tag" --generate-notes --draft
            # the Linux or sources job may have created the release in the meantime
            if ($LASTEXITCODE -ne 0) { gh release upload $tag $file --clobber }
          }

  linux:
    needs: ffmpeg
    # The oldest supported Ubuntu, so the AppImage runs on older distros (packaging rules).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PAGEVOICE_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Odd version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-Linux
          path: packaging/ffmpeg/out

      - name: "Libraries PyInstaller bundles: Qt's X11 plugin needs, PortAudio"
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libportaudio2 xvfb
          chmod +x packaging/ffmpeg/out/linux/bin/ffmpeg

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Build the app (PyInstaller, one folder)
        shell: bash
        run: |
          uv sync --locked --extra gui --group build
          uv run python tools/check_licenses.py
          uv run pyinstaller packaging/pagevoice.spec --noconfirm --log-level WARN
          if find dist/PageVoice -name '*.proposed.json' | grep -q .; then
            echo "The developer manifest got into the build" >&2; exit 1
          fi

      - name: Self-test the built app
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          status=0
          dist/PageVoice/PageVoice --self-test selftest-linux.json || status=$?
          cat selftest-linux.json
          exit $status

      - name: List the Ubuntu libraries in the build (licences and sources)
        run: |
          packaging/linux/system-libs.sh dist/PageVoice > dist/PageVoice/SYSTEM_LIBRARIES.txt
          cp dist/PageVoice/SYSTEM_LIBRARIES.txt dist/SYSTEM_LIBRARIES.txt
          cat dist/SYSTEM_LIBRARIES.txt

      - name: Build the AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/linux/build-appimage.sh "$VERSION"

      - name: Self-test the AppImage (real X display, no system PortAudio)
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: xcb  # the X11 plugin users get, not offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"  # no FUSE on the runner
        run: |
          # Prove the AppImage carries its own PortAudio, as it must on a user's machine.
          sudo apt-get remove -y libportaudio2
          status=0
          xvfb-run -a dist/PageVoice-*-x86_64.AppImage --self-test selftest-appimage.json || status=$?
          cat selftest-appimage.json
          exit $status

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PageVoice-linux
          path: |
            dist/PageVoice-*-x86_64.AppImage
            dist/SYSTEM_LIBRARIES.txt
            selftest-linux.json
            selftest-appimage.json

      - name: Attach to the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tag="$TAG"
          file=$(ls dist/PageVoice-*-x86_64.AppImage)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$file" dist/SYSTEM_LIBRARIES.txt --clobber
          else
            gh release create "$tag" "$file" dist/SYSTEM_LIBRARIES.txt --title "PageVoice $tag" \
              --generate-notes --draft \
              || gh release upload "$tag" "$file" dist/SYSTEM_LIBRARIES.txt --clobber
          fi

  sources:
    # The exact source of the copyleft software in the builds, and every package's licence.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Collect sources and licences
        run: |
          uv sync --locked --extra gui
          packaging/sources.sh
          uv run python tools/third_party.py dist/sources/THIRD_PARTY_LICENSES.txt

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PageVoice-sources
          path: dist/sources

      - name: Attach to the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tag="$TAG"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "PageVoice $tag" --generate-notes --draft || true
          fi
          gh release upload "$tag" dist/sources/* --clobber

  publish:
    # The release stays a draft until the Windows, Linux and sources jobs have all
    # succeeded, so a half-finished release page never appears.
    needs: [windows, linux, sources]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
