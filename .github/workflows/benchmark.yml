# Repeatable voice benchmark on GitHub Actions runners (docs/SPEC.md §10, DECISIONS D22).
# Runs when voice, normalization or render code changes, and on demand. Not a required
# check. The new history.csv rows are uploaded as an artifact; copy them into
# benchmarks/history.csv in the next PR so slowdowns show up over time.

name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/pagevoice/voice/**"
      - "src/pagevoice/normalize/**"
      - "src/pagevoice/render/**"
      - "tools/benchmark.py"
      - "tools/voicetools.py"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      PAGEVOICE_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Cache model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: kokoro-${{ hashFiles('src/pagevoice/voice/model_manifest*.json') }}

      - name: Install
        run: uv sync --locked

      - name: Benchmark
        run: uv run python tools/benchmark.py --variants fp32 int8

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmarks/history.csv
